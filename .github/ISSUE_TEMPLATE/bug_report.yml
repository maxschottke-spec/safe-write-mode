name: Bug report
description: Something does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. See SECURITY.md.
        Please remove tokens, real hostnames and customer data from everything you paste.
  - type: input
    id: version
    attributes:
      label: safe-write-mode version
      description: The tag or commit you installed, for example v0.2.2.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and operating system
      description: Output of `node --version`, plus macOS, Linux or Windows.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest example that shows the problem
      description: A short file we can run, and the command you ran it with, including environment variables such as SAFE_WRITE_MODE.
      render: js
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Error code and message, and the matching line of the audit log if there is one.
    validations:
      required: true
